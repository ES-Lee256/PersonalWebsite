# 游戏项目配置
# 文件必须保存为 UTF-8；路径均相对于本文件所在目录（content/gameproject/）。
#
# 本栏目的项目格式与 GitHub 开源项目相同。
# 另外支持一个特殊项目 [studiowebsite]（工作室官网），同样可以在括号前加 x 关闭。
# 它的跳转按钮默认文字是「去游戏官网」；普通游戏项目的跳转按钮是「去查看」。
#
# 如果本文件没有任何启用的项目，网页正中会显示「暂无游戏，敬请期待」。
# 下列示例均以 x 开头，因此当前页面会保持空状态。

[game]
# 可选：覆盖本栏目的默认标题、英文眉题和说明。
# title = 游戏项目
# kicker = PLAYGROUND
# description = 从规则、叙事到交互，一些正在被做出来的世界。

x[studiowebsite]
title = example
content = 工作室官网的示例介绍。这里可以放一段话，或指向本目录下的 .txt 文件。
picture = studio.jpg
web = https://example.com studio.svg

x[1]
title = example
content = example.txt
picture = pic.jpg
web = 3
1 = https://example.com gamepad.svg 游戏官网
2 = https://store.example.com link.svg 商店页面
3 = https://example.org link.svg

x[2]
title = example
content = 一个没有配图、没有图标的示例项目，用来检查无图卡片的排版。
picture =
web = https://example.com
