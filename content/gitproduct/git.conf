# GitHub 开源项目配置
# 文件必须保存为 UTF-8；路径均相对于本文件所在目录（content/gitproduct/）。
#
# 项目格式：
#   x[1]                 x 表示暂时忽略这个项目；去掉 x 即上线
#   title = 标题
#   content = 直接写一段文字，或指向本目录下的 .txt 文件
#   picture = 本目录下的图片；留空则不占图片位置
#   web = 单个链接，或写数字表示多个链接
#
# web 的格式：链接 [图标文件] [自定义文字]
# 图标紧跟在链接后面，以图片扩展名结尾；图标默认在根目录 icon/ 中。
# 不写图标时，链接后面直接写自定义文字即可，文字中可以带空格。
#
# 单个网站：
#   web = https://example.com
#   web = https://example.com github.svg
#   web = https://example.com github.svg 自定义文字
#
# 多个网站：
#   web = 3
#   1 = https://example.com github.svg 网站甲
#   2 = https://example.org
#   3 = https://example.net link.svg 网站丙
#
# 下列示例均以 x 开头，因此不会出现在网页上。填写真实内容时再去掉 x。

[git]
# 可选：覆盖本栏目的默认标题、英文眉题和说明。
# title = GitHub 开源项目
# kicker = OPEN SOURCE
# description = 代码、工具与仍在生长中的想法。

x[1]
title = example
content = 这是一个示例项目简介。直接写在 content 后面的文字会显示在卡片上，也可以在展开页完整阅读。
picture = pic.jpg
web = https://github.com/example/example github.svg

x[2]
title = example
content = example.txt
picture =
web = 3
1 = https://github.com/example/one github.svg GitHub
2 = https://example.com link.svg 示例网站
3 = https://example.org link.svg

x[3]
title = example
content = 这个示例演示「没有图标、没有配图」的排版：卡片不会保留图片或图标的位置。
picture =
web = https://example.com

