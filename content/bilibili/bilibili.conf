# Bilibili 精选栏配置
# 文件必须保存为 UTF-8；图片路径相对于本文件所在目录（content/bilibili/）。
#
# 精选栏始终显示，即使没有任何启用的项目。
# 项目格式：
#   x[1]           x 表示暂时忽略；去掉 x 即显示
#   title = 标题
#   picture = 封面图片
#   web = https://www.bilibili.com/video/BV...  点击整张卡片跳转的视频链接
#   top = 0        0 为不置顶，1 为置顶（置顶项目排在前面）
#
# web 留空时卡片只展示、不跳转；填写后整张卡片可点击，不单独显示跳转按钮。
#
# 下列示例均以 x 开头，因此当前会显示精选栏的空状态。

[bilibili]
# 可选：覆盖本栏目的默认标题、眉题和说明。
# title = Bilibili 精选
# kicker = BILIBILI FEATURED
# description = 从 Bilibili 挑出的一些片段、创作与收藏。

x[1]
title = example
picture = pic.jpg
web = https://www.bilibili.com/video/BV1xx411c7mD
top = 0

x[2]
title = example
picture =
web =
top = 1

